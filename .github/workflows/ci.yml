name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build all platforms
        run: make release

      - name: Build Debian packages
        run: make deb

      - name: Check Debian package
        run: |
          deb=$(ls dist/usercleanup_*_amd64.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo dpkg -i "$deb"
          usercleanup --version
          sudo dpkg -r usercleanup

      - name: Shellcheck
        run: shellcheck test/test-debian.sh test/testenv/testenv.sh .github/scripts/*.sh

  version:
    name: Version bumped
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check VERSION against main
        run: .github/scripts/check-version.sh "origin/${{ github.base_ref }}"
